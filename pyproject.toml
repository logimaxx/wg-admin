[project]
name = "wg-admin"
version = "0.1.0"
description = "Web UI to manage a running WireGuard instance without replacing its config."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2.0",
    "bcrypt>=4.2.0",
    "qrcode>=8.0",
    "pillow>=10.4.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "httpx>=0.27.0"]

[project.scripts]
wg-admin = "wg_admin.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wg_admin*"]

[tool.setuptools.package-data]
wg_admin = ["templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
