<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if title %}{{ title }} · {% endif %}wg-admin</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("wg-admin-theme");
        var theme = stored === "light" || stored === "dark"
          ? stored
          : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">wg-admin</span>
      </a>
      <div class="top-meta">
        {% if demo %}<span class="pill pill-demo">demo</span>{% endif %}
        <span class="muted">v{{ version }}</span>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to light mode" title="Switch to light mode">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 3v2M12 19v2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M3 12h2M19 12h2M5.2 18.8l1.4-1.4M17.4 6.6l1.4-1.4"></path>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"></path>
          </svg>
        </button>
        {% if request.session.get("auth") %}
        <form method="post" action="/logout" class="inline">
          <input type="hidden" name="csrf" value="{{ csrf }}">
          <button class="linkish" type="submit">Sign out</button>
        </form>
        {% endif %}
      </div>
    </header>
    <main class="main">
      {% if error %}<div class="banner banner-bad" role="alert">{{ error }}</div>{% endif %}
      {% if notice %}<div class="banner banner-ok">{{ notice }}</div>{% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
